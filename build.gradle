buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // ExoPlayer 2.11.8 was published to the retired JCenter repository.
        // Keep the existing Android-compatible version, but confine the HTTPS
        // archive mirror to this dependency group instead of using an HTTP mirror
        // for all plugins and libraries.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'legacyExoPlayer'
                    url = uri('https://maven.aliyun.com/repository/public')
                }
            }
            filter {
                includeGroup 'com.google.android.exoplayer'
            }
        }
    }
}
